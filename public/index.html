<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>난데없는 말들</title>
  <meta name="description" content="누구나 읽을 수 있는 기록 피드입니다.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>난데없는 말들</h1>
    <p id="pageNotice" class="notice" aria-live="polite" hidden></p>
  </header>
  <main id="entryContainer"></main>
  <!-- Docked at the bottom right; folds away while the write panel is open. -->
  <nav id="dock" aria-label="메뉴">
    <button type="button" id="signInButton" hidden>구글로그인</button>
    <button type="button" id="writeToggle" hidden>글쓰기</button>
    <button type="button" id="signOutButton" hidden>로그아웃</button>
  </nav>
  <section id="writeForm" hidden>
    <input type="text" id="entryTitle" placeholder="제목을 넣고">
    <textarea id="entryText" placeholder="글을 작성해보세요"></textarea>
    <div id="photoStrip" hidden></div>
    <div id="formBottom">
      <p id="formMessage" aria-live="polite"></p>
      <input type="date" id="entryDate">
      <button type="button" id="photoButton">그림</button>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button id="saveButton">저장하기</button>
      <button id="deleteButton" hidden>삭제하기</button>
      <button id="cancelButton">취소</button>
    </div>
  </section>
  <footer>
    <p>난데없는 말들&copy;2026.</p>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
