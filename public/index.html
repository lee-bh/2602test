<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf8f2" />
  <title>오늘의 기록</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <header><a class="brand" href="/">오늘의 기록</a><div id="account"></div></header>
    <section id="loading" class="card loading">기록장을 불러오는 중…</section>
    <section id="login" class="card hero" hidden>
      <p class="eyebrow">PRIVATE DIARY</p><h1>오늘을<br>차분히 적어보세요.</h1>
      <p>나만 볼 수 있는 일기장입니다. Google 계정으로 안전하게 시작하세요.</p>
      <a class="button" href="/auth/google">Google로 계속하기 <span>→</span></a>
    </section>
    <section id="app" hidden>
      <div class="toolbar"><div><p class="eyebrow">MY DIARY</p><h1>기록 목록</h1></div><button class="button" id="new-entry">새 일기 쓰기 <span>+</span></button></div>
      <div class="layout"><aside id="entry-list" aria-label="일기 목록"></aside><article id="editor" class="card empty"><p>왼쪽에서 기록을 선택하거나<br>새 일기를 시작하세요.</p></article></div>
    </section>
  </main>
  <template id="editor-template"><form class="editor-form"><div class="editor-top"><input name="entryDate" type="date" required><button type="button" class="icon-button delete" title="삭제">삭제</button></div><input name="title" class="title-input" maxlength="200" placeholder="오늘의 제목" required><textarea name="body" maxlength="20000" placeholder="오늘 있었던 일, 떠오른 생각을 자유롭게 적어보세요."></textarea><div class="form-bottom"><label class="upload"><input type="file" accept="image/*"> 사진 추가</label><span class="hint">이미지는 본인만 볼 수 있습니다.</span><button class="button" type="submit">저장하기 <span>→</span></button></div><p class="message" aria-live="polite"></p></form></template>
  <script type="module" src="/app.js"></script>
</body>
</html>
