<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오늘의 기록</title>
  <meta name="description" content="Cloudflare Workers, D1, R2로 만든 비공개 일기장입니다.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>오늘의 기록</h1>
    <button id="signInButton" hidden>구글로그인</button>
    <button id="signOutButton" hidden>로그아웃</button>
  </header>
  <main id="entryContainer"></main>
  <section id="writeForm" hidden>
    <input type="text" id="entryTitle" placeholder="제목을 넣고">
    <textarea id="entryText" placeholder="글을 작성해보세요"></textarea>
    <p id="formMessage" aria-live="polite"></p>
    <div id="formButtons">
      <input type="date" id="entryDate">
      <label id="photoButton" hidden>사진<input type="file" accept="image/*"></label>
      <button id="cancelButton" hidden>취소</button>
      <button id="saveButton">저장하기</button>
    </div>
  </section>
  <footer>
    <p>오늘의 기록&copy;2026.</p>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
